plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'org.asciidoctor.jvm.convert' version '4.0.5' apply false
    id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1' apply false
    id 'jacoco'
}

ext {
    set('springGrpcVersion', "1.0.2")
    set('springCloudVersion', "2025.1.0")
    set('springBootVersion', "4.1.0")
    set('confluentVersion', "7.6.1")
    // avro 1.11.3 -> 1.11.4 fixes CVE-2024-47561 (schema-parsing RCE).
    set('avroVersion', "1.11.4")
    // langchain4j 1.0.1 -> 1.2.1 fixes CVE-2026-55405 (SQL injection via metadata
    // filters in langchain4j-pgvector); bumping the BOM keeps the core and beta
    // integration modules (pgvector/anthropic -> 1.2.1-beta8) version-aligned.
    set('langchain4jVersion', "1.2.1")
}

allprojects {
    group = 'com.project'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
        maven {
            url = "https://packages.confluent.io/maven/"
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    // Security overrides for libraries whose versions are pinned by the Spring Boot
    // dependency BOM. The BOM forces exact versions, so a plain Gradle constraint or
    // platform import is ignored; the supported override is to bump the BOM's own
    // version property. Property names come from spring-boot-dependencies-${springBootVersion}.pom.
    // spring-framework 7.0.8 -> 7.0.9: CVE-2026-47884 (XsltView RCE, CRITICAL), CVE-2026-47890.
    ext['spring-framework.version'] = '7.0.9'
    // netty 4.2.15 -> 4.2.17.Final: CVE-2026-75595 (SNI routing bypass, CRITICAL) + codec DoS fixes.
    ext['netty.version'] = '4.2.17.Final'
    // jackson 2.x 2.21.4 -> 2.21.7: CVE-2026-89407/89425/68497/91776/91777 (DoS).
    ext['jackson-2-bom.version'] = '2.21.7'
    // jackson 3.x (tools.jackson) 3.1.4 -> 3.1.7: same CVE family.
    ext['jackson-bom.version'] = '3.1.7'
    // tomcat 11.0.22 -> 11.0.25: CVE-2026-65182 (CRITICAL), CVE-2026-65905, CVE-2026-68525.
    ext['tomcat.version'] = '11.0.25'
    // postgresql 42.7.11 -> 42.7.12: CVE-2026-54291 (SCRAM downgrade MITM).
    ext['postgresql.version'] = '42.7.12'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        implementation(platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}"))
        implementation(platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"))
        implementation(platform("org.springframework.grpc:spring-grpc-dependencies:${springGrpcVersion}"))
        implementation(platform("dev.langchain4j:langchain4j-bom:${langchain4jVersion}"))

        constraints {
            implementation("com.google.protobuf:protobuf-java:4.34.2")
            implementation("com.google.protobuf:protobuf-java-util:4.34.2")
            // The libraries below are not managed by the Spring Boot BOM, so a direct
            // Gradle constraint is enough to force the fixed version.
            // lz4-java 1.10.1 -> 1.11.4: CVE-2026-106451 (insecure temp-file RCE).
            implementation("at.yawk.lz4:lz4-java:1.11.4")
            // bouncycastle 1.81 -> 1.85: CVE-2025-14813, CVE-2026-8763, CVE-2026-13506.
            implementation("org.bouncycastle:bcprov-jdk18on:1.85")
            // opennlp 2.5.4 -> 2.5.9: CVE-2026-40682 (XXE), CVE-2026-42027 (class
            // loading), CVE-2026-42440 (DoS).
            implementation("org.apache.opennlp:opennlp-tools:2.5.9")
        }

        // The platform BOMs above only constrain the implementation config; the
        // annotation processor path needs the Boot BOM too, otherwise Lombok has no
        // managed version and compilation fails to resolve it.
        annotationProcessor(platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}"))
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        finalizedBy tasks.named('jacocoTestReport')
    }

    // Emit JaCoCo XML in every module so SonarQube can aggregate coverage
    tasks.withType(JacocoReport).configureEach {
        reports {
            xml.required = true
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // For PathVariables path resolution.
        options.compilerArgs.add('-parameters')
    }
}
