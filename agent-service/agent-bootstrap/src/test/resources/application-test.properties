# Test profile for the bootstrap context-load smoke test. Datasource / agent.vector /
# kafka are pointed at Testcontainers by AgentServiceApplicationTests; the static
# settings below mirror the adapter module's test profile so the full app context
# can start without real infrastructure or secrets.
spring.jpa.hibernate.ddl-auto=create-drop

# langchain4j chat-model beans require non-blank keys at startup (never called here).
langchain4j.open-ai.api-key=test-openai-key
langchain4j.anthropic.api-key=test-anthropic-key

# Boot 4.1 vs Spring Cloud 4.0.x release-train verifier.
spring.cloud.compatibility-verifier.enabled=false

# No OTLP collector in tests.
management.otlp.metrics.export.enabled=false
management.tracing.export.enabled=false
management.logging.export.otlp.enabled=false
