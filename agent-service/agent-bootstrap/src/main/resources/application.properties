spring.application.name=agent-service

# Loom-backed request handling: every servlet request (and @Async work) runs on a
# virtual thread, so blocking LLM/JDBC/Kafka calls no longer pin a platform thread.
# This is the scalability lever for an I/O-bound agent service — it replaces the need
# to move the whole stack to WebFlux while keeping blocking JPA + langchain4j.
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5434/agent_db
spring.datasource.username=agent_user
spring.datasource.password=agent_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=AgentHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8083

spring.config.import=optional:classpath:application-cred.properties

springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
springdoc.api-docs.path=/api/v1-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.logging.export.otlp.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.url=http://localhost:43180/v1/metrics
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:43180/v1/logs
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:43180/v1/traces
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.export.enabled=true

resilience4j.circuitbreaker.instances.llmProvider.register-health-indicator=true
resilience4j.circuitbreaker.instances.llmProvider.sliding-window-size=10
resilience4j.circuitbreaker.instances.llmProvider.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.llmProvider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.llmProvider.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.llmProvider.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.llmProvider.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.retry.instances.llmProvider.max-attempts=3
resilience4j.retry.instances.llmProvider.wait-duration=500ms
resilience4j.retry.instances.llmProvider.enable-exponential-backoff=true
resilience4j.retry.instances.llmProvider.exponential-backoff-multiplier=2
resilience4j.retry.instances.llmProvider.retry-exceptions=\
  com.project.agent.domain.execution.agent.exception.ModelProviderException,\
  com.project.agent.domain.execution.agent.exception.ModelRateLimitException,\
  com.project.agent.domain.execution.agent.exception.ModelTimeoutException,\
  com.project.agent.domain.execution.agent.exception.ModelUnavailableException
resilience4j.retry.instances.llmProvider.ignore-exceptions=\
  com.project.agent.domain.execution.agent.exception.ModelAuthenticationException,\
  com.project.agent.domain.execution.agent.exception.UnsupportedModelException,\
  io.github.resilience4j.circuitbreaker.CallNotPermittedException

# Long-term memory (pgvector) circuit breaker. Both search and index are best-effort in
# RagService, so an open circuit degrades recall to the grounding guard and skips the write
# rather than failing the turn. UnsupportedEmbeddingModelException is a config error, not an
# outage, so it neither trips the breaker nor is retried.
resilience4j.circuitbreaker.instances.vectorStore.register-health-indicator=true
resilience4j.circuitbreaker.instances.vectorStore.sliding-window-size=20
resilience4j.circuitbreaker.instances.vectorStore.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.vectorStore.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.vectorStore.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.vectorStore.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.vectorStore.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.vectorStore.ignore-exceptions=\
  com.project.agent.domain.execution.agent.exception.UnsupportedEmbeddingModelException

# Memory-policy (OPA) circuit breaker. Governance sits on the hot path with a tight timeout;
# a sustained OPA outage trips the breaker so calls fail fast instead of each paying the
# timeout. The adapter's fallback raises MemoryPolicyUnavailableException and the harness then
# applies its configured fail-open / fail-closed posture (agent.memory.policy.fail-open).
resilience4j.circuitbreaker.instances.memoryPolicy.register-health-indicator=true
resilience4j.circuitbreaker.instances.memoryPolicy.sliding-window-size=20
resilience4j.circuitbreaker.instances.memoryPolicy.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.memoryPolicy.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.memoryPolicy.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.memoryPolicy.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.memoryPolicy.automatic-transition-from-open-to-half-open-enabled=true

spring.kafka.bootstrap-servers=localhost:9092
# Producer beans are defined explicitly in KafkaConfig (JSON via StringSerializer).
# TODO: switch to Avro + Confluent Schema Registry to match billing/usage-service.
# Topic the agent publishes token-usage/cost events on (consumed by usage-service).
agent.kafka.topic.usage-recorded=agent.usage.recorded

langchain4j.open-ai.api-key=${OPENAI_API_KEY:}
langchain4j.open-ai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o}
langchain4j.open-ai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY:}
langchain4j.anthropic.chat-model=${ANTHROPIC_CHAT_MODEL:claude-3-5-sonnet-20241022}
# Streaming path is single-provider (OpenAI): mid-stream failover would replay tokens
# already sent to the client, so the reactive SSE endpoint does not fail over.
langchain4j.open-ai.streaming-chat-model=${OPENAI_STREAMING_CHAT_MODEL:gpt-4o}

agent.vector.host=localhost
agent.vector.port=5434
agent.vector.database=agent_db
agent.vector.user=${spring.datasource.username}
agent.vector.password=${spring.datasource.password}
agent.vector.table=conversation_embeddings
agent.vector.dimension=1536

# --- RAG reliability -----------------------------------------------------------
# Retrieval is over-fetched to `candidate-pool-size`, gated to passages whose
# similarity (langchain4j score = (1 + cosine) / 2, in [0,1]) is >= `min-score`,
# then capped at `max-passages`. When nothing clears the bar the agent is told no
# reliable context was found (grounding guard) so it can lower its own confidence.
agent.rag.candidate-pool-size=20
agent.rag.min-score=0.75
agent.rag.max-passages=5

# Hybrid retrieval: dense (vector) + sparse (Postgres full-text) fused by Reciprocal
# Rank Fusion. Sparse catches exact tokens (invoice IDs, error codes) dense misses.
# See docs/rag-hybrid-search.md for the recommended GIN index.
agent.rag.hybrid.enabled=true
agent.rag.hybrid.dense-limit=20
agent.rag.hybrid.sparse-limit=20
agent.rag.hybrid.rrf-k=60

# --- Agent memory (two-tier) ----------------------------------------------------
# Short-term (working) memory: the most recent turns of the live conversation are kept
# verbatim in the prompt, bounded to this many messages so a long conversation cannot
# grow the prompt without limit. Older turns survive only in long-term memory (pgvector),
# recalled by relevance instead of recency. 0 or negative = unbounded (whole transcript).
agent.memory.short-term.max-messages=20
# Redact credential-shaped substrings out of short-term memory before it reaches the prompt
# (long-term memory drops whole passages; short-term is masked since the model needs the live
# turn). Mirrors the secret patterns in policy/agent/memory.rego.
agent.memory.short-term.redact.enabled=true

# Per-conversation rate limit (Bucket4j) on the expensive long-term memory operations —
# recall and persist each spend one token. Over budget, the harness skips that turn's
# long-term work rather than failing it. `capacity` tokens, refilling `refill-tokens` every
# `refill-period-seconds`.
agent.memory.rate-limit.enabled=true
agent.memory.rate-limit.capacity=30
agent.memory.rate-limit.refill-tokens=30
agent.memory.rate-limit.refill-period-seconds=60

# --- Agent memory harness (governance) -----------------------------------------
# The harness gates what the agent may recall into a prompt and persist to long-term
# memory, delegating the verdict to an OPA sidecar running the policy/agent Rego bundle.
# Disabled by default: the AllowAllMemoryPolicyAdapter stands in and every access is
# permitted, so local/dev runs need no OPA. Set enabled=true where the sidecar is present.
# See docs/agent-memory-harness.md.
agent.memory.policy.enabled=${AGENT_MEMORY_POLICY_ENABLED:false}
# When the OPA sidecar is unreachable: false = fail-closed (drop the recall / skip the
# persist), true = fail-open (allow). Fail-closed is the safe default.
agent.memory.policy.fail-open=false
agent.memory.policy.opa.base-url=${OPA_BASE_URL:http://localhost:8181}
agent.memory.policy.opa.decision-path=/v1/data/agent/memory/decision
agent.memory.policy.opa.timeout-ms=250
